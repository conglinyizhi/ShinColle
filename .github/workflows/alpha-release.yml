name: Alpha Release

on:
  workflow_dispatch:
    inputs:
      release_suffix:
        description: Optional suffix appended to the release title
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile sources
        run: ./gradlew compileJava --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build jar
        run: ./gradlew build --no-daemon

      - name: Collect release metadata
        id: meta
        run: |
          DATE="$(date -u +'%Y%m%d')"
          TAG="alpha-${DATE}-${GITHUB_RUN_NUMBER}"
          if [ -n "${{ inputs.release_suffix }}" ]; then
            NAME="Alpha Build ${DATE}-${GITHUB_RUN_NUMBER} (${{ inputs.release_suffix }})"
          else
            NAME="Alpha Build ${DATE}-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Collect jar artifacts
        run: |
          mkdir -p release-artifacts
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} release-artifacts/ \;
          ls -lah release-artifacts

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          generate_release_notes: true
          body: |
            Automated alpha build for testing only.

            Notes:
            - This is a migration-in-progress build, not a stable release.
            - Single-player testing is recommended first.
            - Please attach `latest.log` or crash reports when reporting issues.
          files: release-artifacts/*.jar
