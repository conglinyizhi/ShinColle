name: Canary Release

on:
  push:
    tags:
      - "canary-*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Canary tag to release, for example canary-20260531
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_RELEASE_TAG"
          else
            TAG="$REF_NAME"
          fi

          if [ -z "$TAG" ]; then
            echo "Release tag is empty" >&2
            exit 1
          fi

          case "$TAG" in
            canary-*) ;;
            *)
              echo "Unsupported release tag: $TAG" >&2
              exit 1
              ;;
          esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=Canary Build ${TAG#canary-}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Make release note script executable
        run: chmod +x ./scripts/build_canary_release_notes.sh

      - name: Verify Kotlin test compilation
        run: ./gradlew clean compileTestKotlin --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build jar
        run: ./gradlew build --no-daemon

      - name: Collect changelog
        id: changelog
        env:
          CURRENT_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          ./scripts/build_canary_release_notes.sh "$CURRENT_TAG" canary-release-notes.md

          {
            echo "body<<EOF"
            cat canary-release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Collect jar artifacts
        run: |
          mkdir -p release-artifacts
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} release-artifacts/ \;
          ls -lah release-artifacts

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          generate_release_notes: false
          body: ${{ steps.changelog.outputs.body }}
          files: release-artifacts/*.jar
