name: Rolling Prerelease

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      release_note:
        description: 本次金丝雀构建备注 / Canary build note / カナリアビルドのメモ
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: rolling-prerelease-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_NOTE: ${{ inputs.release_note }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            CHANNEL="nightly"
            TAG="nightly"
            NAME="Nightly Build"
          else
            CHANNEL="canary"
            TAG="canary"
            NAME="Canary Build"
          fi

          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          UTC_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          CN_DATE="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S CST')"

          {
            echo "channel=$CHANNEL"
            echo "tag=$TAG"
            echo "name=$NAME"
            echo "short_sha=$SHORT_SHA"
            echo "utc_time=$UTC_TIME"
            echo "cn_date=$CN_DATE"
            echo "release_note<<EOF"
            printf '%s\n' "$INPUT_RELEASE_NOTE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether nightly should build
        id: gate
        if: steps.meta.outputs.channel == 'nightly'
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag }}
        run: |
          git fetch --tags --force

          COMMIT_FILTER='^(feat|fix|perf|refactor|revert|test)(\(.+\))?:'

          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            COUNT="$(git log "refs/tags/$TAG_NAME..HEAD" --no-merges --format='%s' | grep -Ei "$COMMIT_FILTER" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
          else
            COUNT="$(git log HEAD --no-merges --format='%s' | grep -Ei "$COMMIT_FILTER" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
          fi

          if [ "$COUNT" -gt 10 ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Skip nightly release
        if: steps.meta.outputs.channel == 'nightly' && steps.gate.outputs.should_release != 'true'
        run: |
          echo "Skipping nightly release because only ${{ steps.gate.outputs.count }} eligible commits were found since the previous nightly tag."

      - name: Set up JDK 21
        if: steps.meta.outputs.channel != 'nightly' || steps.gate.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        if: steps.meta.outputs.channel != 'nightly' || steps.gate.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        if: steps.meta.outputs.channel != 'nightly' || steps.gate.outputs.should_release == 'true'
        run: chmod +x ./gradlew

      - name: Make release note script executable
        if: steps.meta.outputs.channel != 'nightly' || steps.gate.outputs.should_release == 'true'
        run: chmod +x ./scripts/build_canary_release_notes.sh

      - name: Verify Kotlin test compilation
        if: steps.meta.outputs.channel != 'nightly' || steps.gate.outputs.should_release == 'true'
        run: ./gradlew clean compileTestKotlin --no-daemon

      - name: Run tests
        if: steps.meta.outputs.channel != 'nightly' || steps.gate.outputs.should_release == 'true'
        run: ./gradlew test --no-daemon

      - name: Build jar
        if: steps.meta.outputs.channel != 'nightly' || steps.gate.outputs.should_release == 'true'
        env:
          BUILD_TYPE: ${{ steps.meta.outputs.channel }}
        run: ./gradlew clean build --no-daemon

      - name: Collect changelog
        id: changelog
        if: steps.meta.outputs.channel != 'nightly' || steps.gate.outputs.should_release == 'true'
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          CURRENT_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.name }}
          RELEASE_NOTE: ${{ steps.meta.outputs.release_note }}
          FULL_SHA: ${{ github.sha }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          REF_NAME: ${{ github.ref_name }}
          UTC_TIME: ${{ steps.meta.outputs.utc_time }}
          CN_DATE: ${{ steps.meta.outputs.cn_date }}
          NIGHTLY_COUNT: ${{ steps.gate.outputs.count }}
        run: |
          ./scripts/build_canary_release_notes.sh "$CHANNEL" "$CURRENT_TAG" "$RELEASE_NAME" "$RELEASE_NOTE" canary-release-notes.md

          {
            echo "body<<EOF"
            cat canary-release-notes.md
            echo
            echo "<details>"
            echo "<summary>Build Metadata</summary>"
          echo "<summary>构建元数据</summary>"
          echo "<summary>ビルドメタデータ</summary>"
            echo
            echo "## Overview"
            echo "## 概览"
            echo "## 概要"
            echo
            echo "- Channel: \`$CHANNEL\`"
            echo "- 渠道: \`$CHANNEL\`"
            echo "- チャンネル: \`$CHANNEL\`"
            echo "- Tag: \`$CURRENT_TAG\`"
            echo "- 标签: \`$CURRENT_TAG\`"
            echo "- タグ: \`$CURRENT_TAG\`"
            echo "- Commit: \`$FULL_SHA\`"
            echo "- 提交哈希: \`$FULL_SHA\`"
            echo "- コミット: \`$FULL_SHA\`"
            echo "- Short SHA: \`$SHORT_SHA\`"
            echo "- 短哈希: \`$SHORT_SHA\`"
            echo "- 短縮 SHA: \`$SHORT_SHA\`"
            echo "- Ref: \`$REF_NAME\`"
            echo "- 引用: \`$REF_NAME\`"
            echo "- 参照: \`$REF_NAME\`"
            echo "- Built At (UTC): \`$UTC_TIME\`"
            echo "- 构建时间 (UTC): \`$UTC_TIME\`"
            echo "- ビルド時刻 (UTC): \`$UTC_TIME\`"
            echo "- Built At (CST): \`$CN_DATE\`"
            echo "- 构建时间 (CST): \`$CN_DATE\`"
            echo "- ビルド時刻 (CST): \`$CN_DATE\`"
            if [ "$CHANNEL" = "nightly" ]; then
              echo "- Eligible commits since previous nightly: \`${NIGHTLY_COUNT:-0}\`"
              echo "- 上次 nightly 以来符合条件的提交数: \`${NIGHTLY_COUNT:-0}\`"
              echo "- 前回 nightly 以降の対象コミット数: \`${NIGHTLY_COUNT:-0}\`"
              echo "- Counted types: \`feat|fix|perf|refactor|revert|test\`"
              echo "- 计数类型: \`feat|fix|perf|refactor|revert|test\`"
              echo "- 集計対象: \`feat|fix|perf|refactor|revert|test\`"
            fi
            echo
            echo "</details>"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Move rolling tag to current commit
        if: steps.meta.outputs.channel != 'nightly' || steps.gate.outputs.should_release == 'true'
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG_NAME" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG_NAME" --force

      - name: Collect jar artifacts
        if: steps.meta.outputs.channel != 'nightly' || steps.gate.outputs.should_release == 'true'
        env:
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          MOD_ID="$(grep '^mod_id=' gradle.properties | cut -d= -f2)"
          MC_VERSION="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"
          MOD_VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"

          mkdir -p release-artifacts
          JAR_NAME="${MOD_ID}-mc${MC_VERSION}-${MOD_VERSION}-${SHORT_SHA}-${CHANNEL}.jar"
          JAR_PATH="build/libs/${JAR_NAME}"

          if [ -f "$JAR_PATH" ]; then
            cp "$JAR_PATH" release-artifacts/
            echo "Collected: $JAR_NAME"
          else
            echo "ERROR: Expected jar not found: $JAR_PATH"
            echo "Available jars in build/libs:"
            ls -la build/libs/
            exit 1
          fi

          ls -lah release-artifacts

      - name: Delete old release assets
        if: steps.meta.outputs.channel != 'nightly' || steps.gate.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
        run: |
          gh release view "$TAG_NAME" --repo "${{ github.repository }}" --json assets -q '.assets[].id' 2>/dev/null | while read -r asset_id; do
            if [ -n "$asset_id" ]; then
              echo "Deleting old asset $asset_id"
              gh api "repos/${{ github.repository }}/releases/assets/$asset_id" -X DELETE
            fi
          done

      - name: Create or update prerelease
        if: steps.meta.outputs.channel != 'nightly' || steps.gate.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }} (${{ steps.meta.outputs.short_sha }})
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: ${{ steps.changelog.outputs.body }}
          files: release-artifacts/*.jar
          overwrite_files: true

  report-failure:
    name: Report nightly build failure
    needs: build-and-release
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'schedule'
    permissions:
      actions: read
      contents: read
      issues: write

    steps:
      - name: Ensure failure label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "ci-failure" --color "D93F0B" --description "Nightly CI build failures" --repo "${{ github.repository }}" || true

      - name: Collect run metadata
        id: meta
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"

      - name: Download and summarize logs
        id: logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ZIP="run-logs.zip"
          mkdir -p run-logs

          # The logs API may briefly return 404 right after the upstream job ends,
          # so retry a few times before falling back to gh run view --log.
          for attempt in 1 2 3; do
            if gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/logs" > "$ZIP" 2>/dev/null; then
              if unzip -q "$ZIP" -d run-logs 2>/dev/null; then
                LOG_FILE="$(find run-logs -type f -name '*.txt' -print -quit)"
                if [ -n "$LOG_FILE" ]; then
                  echo "log_file=$LOG_FILE" >> "$GITHUB_OUTPUT"
                  tail -n 200 "$LOG_FILE" > log-tail.txt
                  break
                fi
              fi
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Log download via API failed, retrying in 5 seconds... (attempt ${attempt})"
              sleep 5
            fi
          done

          if [ ! -f log-tail.txt ]; then
            echo "Falling back to gh run view --log"
            if gh run view "$RUN_ID" --repo "$REPOSITORY" --log > run-logs.txt 2>/dev/null; then
              tail -n 200 run-logs.txt > log-tail.txt
            else
              echo "Unable to download logs for run ${RUN_ID}" > log-tail.txt
            fi
          fi

      - name: Create failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ steps.meta.outputs.run_url }}
        run: |
          TITLE="[Nightly] 构建失败：${REF_NAME} @ ${SHA}"

          # Use printf with single-quoted format strings so backticks are emitted
          # literally instead of being interpreted as shell command substitution.
          {
            echo "## 失败摘要"
            echo ""
            printf -- '- 工作流：`%s`\n' "$WORKFLOW_NAME"
            printf -- '- 触发方式：`%s`（每夜构建）\n' "$EVENT_NAME"
            printf -- '- 分支：`%s`\n' "$REF_NAME"
            printf -- '- 提交：`%s`\n' "$SHA"
            printf -- '- 运行链接：%s\n' "$RUN_URL"
            echo ""
            echo "## 相关提交"
            echo ""
            printf -- '`%s`\n' "$SHA"
            echo ""
            if [ -f log-tail.txt ]; then
              echo "## 日志节选（末尾 200 行）"
              echo ""
              echo "<details>"
              echo "<summary>点击展开</summary>"
              echo ""
              echo '```'
              cat log-tail.txt
              echo ""
              echo '```'
              echo ""
              echo "</details>"
            fi
          } > issue-body.md

          gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file issue-body.md --label "ci-failure"
